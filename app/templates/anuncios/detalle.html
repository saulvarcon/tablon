{% extends "base.html" %}
{% block content %}
<span class="badge bg-secondary">{{ a.categoria.nombre }}</span>
<h2 class="mt-2">{{ a.titulo }}</h2>
<p class="text-muted">Publicado por {{ a.usuario.nombre }} el {{ a.fecha.strftime('%d/%m/%Y %H:%M') }}</p>
<p style="white-space:pre-line">{{ a.descripcion }}</p>
<a href="{{ url_for('main.index') }}" class="btn btn-secondary">Volver</a>
{% endblock %}
